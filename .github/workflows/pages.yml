name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # The refresh bot commits with the default Actions token, whose pushes do NOT
  # trigger push workflows — deploy on the refresh workflow's completion instead.
  workflow_run:
    workflows: ["Refresh X reply queue"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage site files
        # Serve only what the PWA needs; keeps engine sources and worker docs off the CDN
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.json .nojekyll _site/
          cp icon-192.png icon-512.png icon-512-maskable.png apple-touch-icon.png _site/
          cp metrics.json learnings.jsonl receipts.json state.json _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
