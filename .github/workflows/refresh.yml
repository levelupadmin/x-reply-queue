name: Refresh X reply queue

on:
  schedule:
    # 01:00 UTC = 06:30 AM IST, Monday through Friday
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
    # Manual trigger from GitHub UI / mobile app

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run refresh
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python refresh.py

      - name: Commit and push if changed
        run: |
          git config user.name "x-reply-engine-bot"
          git config user.email "bot@leveluplearning.in"
          git add index.html state.json metrics.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push retry $i"; sleep 4
            done
          fi

      - name: Send push notifications
        if: success()
        continue-on-error: true
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBS_TOKEN: ${{ secrets.PUSH_SUBS_TOKEN }}
        run: |
          npm i web-push@3 --no-save --silent
          node send_push.js
